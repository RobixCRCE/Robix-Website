<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>ROBIX 3D GLB Model Preview</title>
  <style>
    body {
      margin: 0;
      background: #08080a;
      color: #fff;
      font-family: monospace;
      overflow: hidden;
    }
    #info {
      position: absolute;
      top: 15px;
      left: 15px;
      z-index: 10;
      background: rgba(10, 10, 15, 0.85);
      border: 1px solid rgba(255, 50, 50, 0.4);
      padding: 12px 18px;
      border-radius: 6px;
      pointer-events: none;
    }
    #info h1 {
      margin: 0 0 6px 0;
      font-size: 16px;
      color: #ff3231;
      letter-spacing: 2px;
    }
    #info p {
      margin: 2px 0;
      font-size: 12px;
      color: #aaa;
    }
  </style>
  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { GLTFLoader } from 'https://esm.sh/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
    import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0a0a0f);

    const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 0, 4.8);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(window.devicePixelRatio);
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.35;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    document.body.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.autoRotate = false;

    // Showroom Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.5);
    keyLight.position.set(4, 5, 4);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x88ccff, 1.2);
    fillLight.position.set(-4, -1, 3);
    scene.add(fillLight);

    const redRim = new THREE.DirectionalLight(0xff2222, 2.8);
    redRim.position.set(-3, 3, -3);
    scene.add(redRim);

    const cyanRim = new THREE.DirectionalLight(0x00e5ff, 2.0);
    cyanRim.position.set(4, -2, -3);
    scene.add(cyanRim);

    const frontLight = new THREE.DirectionalLight(0xffffff, 1.0);
    frontLight.position.set(0, 0, 5);
    scene.add(frontLight);

    let model = null;
    const loader = new GLTFLoader();
    loader.load(
      '/models/robix-logo.glb',
      (gltf) => {
        model = gltf.scene;
        scene.add(model);
        document.getElementById('status-text').innerText = 'Model Loaded Successfully!';
        document.getElementById('status-text').style.color = '#00ff88';
      },
      undefined,
      (err) => {
        console.error(err);
        document.getElementById('status-text').innerText = 'Error loading model: ' + err.message;
        document.getElementById('status-text').style.color = '#ff3333';
      }
    );

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();
  </script>
</head>
<body>
  <div id="info">
    <h1>ROBIX 3D MODEL</h1>
    <p>Source: public/logos/robix-logo.png</p>
    <p>File: public/models/robix-logo.glb</p>
    <p id="status-text" style="color: #ffaa00;">Loading GLB...</p>
  </div>
</body>
</html>
