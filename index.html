<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />

  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>ROBIX</title>
</head>

<body>

  <div id="app">

    <section id="preloader">

      <!-- Mechanical outer structure -->
      <div class="mech-frame" aria-hidden="true">

        <div class="mech-panel mp1"></div>
        <div class="mech-panel mp2"></div>
        <div class="mech-panel mp3"></div>
        <div class="mech-panel mp4"></div>

        <div class="diag d1"></div>
        <div class="diag d2"></div>
        <div class="diag d3"></div>
        <div class="diag d4"></div>

        <div class="core-ring">
          <div class="core-ticks"></div>
        </div>

        <div class="lock-flash"></div>

      </div>


      <!-- Engineering grid -->
      <svg id="grid" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">

        <!-- Vertical lines -->

        <line class="v" x1="110" y1="0" x2="110" y2="1000" />
        <line class="v" x1="150" y1="0" x2="150" y2="1000" />
        <line class="v" x1="190" y1="0" x2="190" y2="1000" />
        <line class="v" x1="230" y1="0" x2="230" y2="1000" />
        <line class="v" x1="270" y1="0" x2="270" y2="1000" />
        <line class="v" x1="310" y1="0" x2="310" y2="1000" />
        <line class="v" x1="350" y1="0" x2="350" y2="1000" />
        <line class="v" x1="390" y1="0" x2="390" y2="1000" />
        <line class="v" x1="430" y1="0" x2="430" y2="1000" />
        <line class="v" x1="470" y1="0" x2="470" y2="1000" />
        <line class="v" x1="510" y1="0" x2="510" y2="1000" />
        <line class="v" x1="550" y1="0" x2="550" y2="1000" />
        <line class="v" x1="590" y1="0" x2="590" y2="1000" />
        <line class="v" x1="630" y1="0" x2="630" y2="1000" />
        <line class="v" x1="670" y1="0" x2="670" y2="1000" />
        <line class="v" x1="710" y1="0" x2="710" y2="1000" />
        <line class="v" x1="750" y1="0" x2="750" y2="1000" />
        <line class="v" x1="790" y1="0" x2="790" y2="1000" />
        <line class="v" x1="830" y1="0" x2="830" y2="1000" />
        <line class="v" x1="870" y1="0" x2="870" y2="1000" />


        <!-- Horizontal lines -->

        <line class="h" x1="0" y1="230" x2="1000" y2="230" />
        <line class="h" x1="0" y1="300" x2="1000" y2="300" />
        <line class="h" x1="0" y1="370" x2="1000" y2="370" />
        <line class="h" x1="0" y1="440" x2="1000" y2="440" />
        <line class="h" x1="0" y1="510" x2="1000" y2="510" />
        <line class="h" x1="0" y1="580" x2="1000" y2="580" />
        <line class="h" x1="0" y1="650" x2="1000" y2="650" />
        <line class="h" x1="0" y1="720" x2="1000" y2="720" />

      </svg>


      <!-- Grid intersection flashes -->

      <div class="cross" style="left:24%;top:30%"></div>
      <div class="cross" style="left:32%;top:43%"></div>
      <div class="cross" style="left:40%;top:58%"></div>
      <div class="cross" style="left:46%;top:54%"></div>
      <div class="cross" style="left:54%;top:40%"></div>
      <div class="cross" style="left:60%;top:43%"></div>
      <div class="cross" style="left:68%;top:58%"></div>
      <div class="cross" style="left:74%;top:54%"></div>


      <!-- ROBIX logo assembly -->

      <div id="logoStage">

        <img class="logo-ghost" src="/logos/robix-logo.png" alt="">


        <div class="logo-slice slice-1"></div>
        <div class="logo-slice slice-2"></div>
        <div class="logo-slice slice-3"></div>
        <div class="logo-slice slice-4"></div>
        <div class="logo-slice slice-5"></div>
        <div class="logo-slice slice-6"></div>


        <img class="logo-final" src="/logos/robix-logo.png" alt="ROBIX">


        <div class="energy"></div>

      </div>


      <!-- Status -->

      <div class="intro-copy">

        <div id="status">
          SYSTEM INITIALIZING
        </div>

      </div>

    </section>
    <section id="hero">

      <!-- Background engineering grid -->
      <div class="hero-grid" aria-hidden="true"></div>


      <!-- Decorative frame -->
      <div class="hero-frame" aria-hidden="true">

        <div class="frame-line frame-top"></div>
        <div class="frame-line frame-bottom"></div>

        <div class="frame-corner corner-tl"></div>
        <div class="frame-corner corner-tr"></div>
        <div class="frame-corner corner-bl"></div>
        <div class="frame-corner corner-br"></div>

      </div>


      <!-- LEFT SIDE -->
      <div class="hero-copy">

        <div class="hero-kicker">
          ROBIX // FR. CRCE
        </div>


        <h1 class="hero-title">

          <span class="hero-line">
            WE TRANSFORM
          </span>

          <span class="hero-line">
            IDEAS INTO
          </span>

          <span class="hero-line hero-line-accent">
            MACHINES.
          </span>

        </h1>


        <p class="hero-description">

          A student robotics team designing,
          engineering and building machines
          for competitions, workshops and
          technical experimentation.

        </p>


        <div class="hero-meta">

          <span>
            ROBOTICS
          </span>

          <span>
            ENGINEERING
          </span>

          <span>
            COMPETITION
          </span>

        </div>

      </div>


      <!-- RIGHT SIDE / MECHANICAL CORE -->
      <div class="hero-machine" aria-hidden="true">

        <div class="machine-ring ring-outer"></div>

        <div class="machine-ring ring-middle"></div>

        <div class="machine-ring ring-inner"></div>


        <div class="machine-panel machine-panel-left"></div>

        <div class="machine-panel machine-panel-right"></div>


        <div class="machine-core machine-core-3d">

          <iframe class="optimus-model" title="Optimus Prime 3D Model"
            src="https://sketchfab.com/models/461e0c3dc1d24b6c93747b38121a0a21/embed?autostart=1&ui_infos=0&ui_inspector=0&ui_help=0&ui_settings=0&ui_vr=0&ui_fullscreen=0&ui_annotations=0&ui_stop=0&ui_hint=0&ui_theme=dark"
            allow="autoplay; fullscreen; xr-spatial-tracking" allowfullscreen>
          </iframe>

        </div>


        <div class="machine-label label-top">
          CORE // RBX-01
        </div>

        <div class="machine-label label-bottom">
          STATUS // ACTIVE
        </div>

      </div>


      <!-- Bottom scroll cue -->
      <div class="hero-scroll">

        <span>
          SCROLL TO ENGAGE
        </span>

        <div class="scroll-line"></div>

      </div>

    </section>

  </div>

  <script type="module" src="/src/main.js"></script>

</body>

</html>
